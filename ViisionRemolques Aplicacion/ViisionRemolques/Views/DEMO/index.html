<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcuSeek (clon)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AcuSeek</h1>
    <span class="sub">Búsqueda de video por lenguaje natural</span>
  </header>

  <!-- Search bar -->
  <section class="searchbar">
    <div class="categories" id="categories">
      <button data-q="person">Person</button>
      <button data-q="vehicle">Vehicle</button>
      <button data-q="non-motor vehicle">NMV</button>
      <button data-q="object">Object</button>
      <button data-q="animal">Animal</button>
    </div>

    <div class="query-row">
      <input id="query" type="text"
        placeholder='Describe lo que buscas, ej. "a person in red clothes"' />
      <button id="searchBtn" class="primary">Search</button>
    </div>

    <div class="filters">
      <div class="range" id="range">
        <button data-range="today" class="active">Today</button>
        <button data-range="3d">3 Days</button>
        <button data-range="7d">7 Days</button>
        <button data-range="custom">Custom</button>
      </div>

      <div id="customDates" class="custom-dates" hidden>
        <label>Desde <input type="datetime-local" id="startDate" /></label>
        <label>Hasta <input type="datetime-local" id="endDate" /></label>
      </div>

      <div class="channel-select">
        <details>
          <summary>Canales (<span id="chCount">todos</span>)</summary>
          <div class="channel-list" id="channelList"></div>
        </details>
      </div>

      <label class="sim">
        Similitud <span id="simVal">60</span>%
        <input type="range" id="similarity" min="0" max="100" value="60" />
      </label>
    </div>
  </section>

  <!-- Favorites / History -->
  <section class="history">
    <div class="chip-row"><strong>★ Favoritos:</strong><div id="favChips" class="chips"></div></div>
    <div class="chip-row"><strong>Historial:</strong><div id="historyChips" class="chips"></div></div>
  </section>

  <!-- Results -->
  <section class="results">
    <div class="toolbar">
      <label><input type="checkbox" id="selectAll" /> Seleccionar todo</label>
      <button id="exportBtn" class="btn">⭳ Exportar CSV</button>
      <label class="tuning-toggle">
        <input type="checkbox" id="tuningToggle" /> AcuSeek Tuning
      </label>
      <span id="tuningInfo" hidden>
        Etiqueta ≥4 correctas y ≥6 incorrectas —
        <b id="cntC">0</b> correctas / <b id="cntI">0</b> incorrectas
      </span>
      <button id="tuningSubmit" class="btn primary-sm" hidden disabled>Enviar tuning</button>
      <span id="favWrap" class="fav-wrap" hidden>
        <button id="favBtn" class="link">☆ Guardar en favoritos</button>
      </span>
      <span id="statusText" class="status"></span>
      <span id="progressWrap" hidden>
        <span class="progress"><span id="progressBar"></span></span>
        <button id="cancelBtn" class="link">Cancelar</button>
      </span>
    </div>

    <div class="results-body">
      <div id="grid" class="grid"></div>
      <aside id="detail" class="detail" hidden></aside>
    </div>

    <div id="pager" class="pager" hidden>
      <button id="prevPage">‹</button>
      <span id="pageInfo"></span>
      <button id="nextPage">›</button>
    </div>
  </section>

  <script type="module" src="clip-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
